name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: Formato, compilación y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Instalar Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Ejecutar verificaciones
        run: bash scripts/ci.sh
