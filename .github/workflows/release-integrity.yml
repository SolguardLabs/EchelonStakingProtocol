name: Release integrity

on:
  push:
    branches: [production]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Verify immutable references
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: bash
        run: |
          git fetch origin main production --tags
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse origin/main^{commit})"
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse origin/production^{commit})"
      - run: bash scripts/ci.sh
